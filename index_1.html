<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aprova+ | Sua plataforma de preparação para concursos públicos</title>
<style>
  :root{
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --grid:           #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-1:       #2a78d6; /* blue */
    --series-2:       #eb6834; /* orange */
    --series-3:       #1baf7a; /* aqua */
    --series-4:       #eda100; /* yellow */
    --series-5:       #e87ba4; /* magenta */
    --series-6:       #008300; /* green */
    --series-7:       #4a3aa7; /* violet */
    --series-8:       #e34948; /* red */
    --seq-100: #cde2fb; --seq-250:#86b6ef; --seq-400:#3987e5; --seq-450:#2a78d6; --seq-550:#1c5cab; --seq-650:#104281;
    --good:     #0ca30c;
    --warning:  #fab219;
    --serious:  #ec835a;
    --critical: #d03b3b;
    --success-text: #006300;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      color-scheme: dark;
      --surface-1: #1a1a19; --page:#0d0d0d;
      --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --border: rgba(255,255,255,0.10);
      --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500;
      --series-5:#d55181; --series-6:#008300; --series-7:#9085e9; --series-8:#e66767;
      --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#e66767;
      --success-text:#0ca30c;
    }
  }
  /* explicit override applied by the light/dark toggle, wins regardless of OS setting */
  :root[data-theme="dark"]{
    color-scheme: dark;
    --surface-1: #1a1a19; --page:#0d0d0d;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border: rgba(255,255,255,0.10);
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500;
    --series-5:#d55181; --series-6:#008300; --series-7:#9085e9; --series-8:#e66767;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#e66767;
    --success-text:#0ca30c;
  }
  :root[data-theme="light"]{ color-scheme: light; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--page); color:var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size:15px; line-height:1.5;
  }
  a{color:var(--series-1);}
  button{font-family:inherit;}
  #app{display:flex; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:230px; flex:0 0 230px; background:var(--surface-1);
    border-right:1px solid var(--border); padding:20px 14px; position:sticky; top:0; height:100vh;
    display:flex; flex-direction:column; gap:4px;
  }
  .brand{display:flex; align-items:center; gap:8px; padding:4px 8px 20px 8px;}
  .brand-mark{width:30px;height:30px;border-radius:8px;background:var(--series-1);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;}
  .brand-name{font-weight:700; font-size:17px;}
  .brand-mark-img{width:30px; height:30px; border-radius:8px; display:block; flex:0 0 30px; object-fit:contain;}
  .brand-name-img{height:16px; width:auto; display:block;}
  [data-theme="dark"] .brand-name-img{ filter:invert(1); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .brand-name-img{ filter:invert(1); } }
  .theme-toggle{
    margin-left:auto; width:30px; height:30px; border-radius:8px; border:1px solid var(--border);
    background:var(--page); color:var(--text-secondary); display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:14px; flex:0 0 30px;
  }
  .theme-toggle:hover{background:var(--surface-1); color:var(--text-primary);}
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px;
    color:var(--text-secondary); cursor:pointer; font-size:14px; font-weight:500; border:none; background:transparent; text-align:left; width:100%;
  }
  .nav-item:hover{background:var(--page); color:var(--text-primary);}
  .nav-item.active{background:var(--series-1); color:#fff;}
  .nav-icon{width:18px; text-align:center; flex:0 0 18px;}
  .sidebar-footer{margin-top:auto; padding-top:14px; border-top:1px solid var(--border);}
  .user-chip{display:flex; align-items:center; gap:8px; padding:8px; border-radius:10px; cursor:pointer;}
  .user-chip:hover{background:var(--page);}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--series-7);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 32px;}
  .user-chip-name{font-size:13px; font-weight:600; line-height:1.2;}
  .user-chip-sub{font-size:11px; color:var(--text-muted);}

  /* ---------- Main ---------- */
  .main{flex:1; min-width:0; padding:26px 32px 60px 32px;}
  .page-header{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:22px;}
  .page-title{font-size:22px; font-weight:700; margin:0 0 4px 0;}
  .page-subtitle{color:var(--text-secondary); font-size:13.5px; margin:0;}
  .btn{
    display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border-radius:9px; border:1px solid var(--border);
    background:var(--surface-1); color:var(--text-primary); font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .btn:hover{background:var(--page);}
  .btn-primary{background:var(--series-1); border-color:var(--series-1); color:#fff;}
  .btn-primary:hover{background:var(--seq-550);}
  .btn-sm{padding:6px 11px; font-size:12.5px; border-radius:7px;}
  .btn-ghost{background:transparent; border-color:transparent; color:var(--series-1);}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}

  /* ---------- Cards / grid ---------- */
  .grid{display:grid; gap:16px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:2fr 1fr;}
  @media (max-width:1100px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;} .grid-3{grid-template-columns:1fr 1fr;} }
  .card{background:var(--surface-1); border:1px solid var(--border); border-radius:14px; padding:18px 20px;}
  .card-title{font-size:14.5px; font-weight:700; margin:0 0 2px 0;}
  .card-sub{font-size:12px; color:var(--text-muted); margin:0 0 14px 0;}
  .stat-tile .stat-label{font-size:12px; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
  .stat-tile .stat-value{font-size:30px; font-weight:700; margin:4px 0 2px 0;}
  .stat-tile .stat-delta{font-size:12px; color:var(--text-secondary);}

  /* ---------- badges / status ---------- */
  .badge{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:700;}
  .badge-good{background:color-mix(in srgb, var(--good) 16%, transparent); color:var(--success-text);}
  .badge-warning{background:color-mix(in srgb, var(--warning) 22%, transparent); color:#8a5a00;}
  .badge-critical{background:color-mix(in srgb, var(--critical) 16%, transparent); color:var(--critical);}
  .badge-muted{background:var(--page); color:var(--text-secondary); border:1px solid var(--border);}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .badge-warning{color:#ffd166;} }
  :root[data-theme="dark"] .badge-warning{color:#ffd166;}

  /* ---------- bars ---------- */
  .hbar-row{display:grid; grid-template-columns:150px 1fr 42px; align-items:center; gap:10px; margin-bottom:10px;}
  .hbar-label{font-size:12.5px; color:var(--text-secondary); text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .hbar-track{background:var(--grid); border-radius:5px; height:14px; overflow:hidden; position:relative;}
  .hbar-fill{height:100%; border-radius:5px 0 0 5px;}
  .hbar-value{font-size:12px; font-weight:700; color:var(--text-secondary);}

  /* ---------- tabs ---------- */
  .tabs{display:flex; gap:6px; border-bottom:1px solid var(--border); margin-bottom:20px; flex-wrap:wrap;}
  .tab{padding:9px 14px; font-size:13.5px; font-weight:600; color:var(--text-secondary); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;}
  .tab.active{color:var(--series-1); border-color:var(--series-1);}

  /* ---------- forms ---------- */
  label{display:block; font-size:12.5px; font-weight:600; color:var(--text-secondary); margin-bottom:5px;}
  input[type=text], input[type=email], input[type=password], input[type=search], select, textarea{
    width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--border); background:var(--page);
    color:var(--text-primary); font-size:13.5px; font-family:inherit;
  }
  .field{margin-bottom:14px;}
  .chip-select{display:flex; flex-wrap:wrap; gap:7px;}
  .chip{padding:6px 12px; border-radius:99px; border:1px solid var(--border); background:var(--page); font-size:12.5px; font-weight:600; cursor:pointer; color:var(--text-secondary);}
  .chip.selected{background:var(--series-1); border-color:var(--series-1); color:#fff;}

  /* ---------- table ---------- */
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; color:var(--text-muted); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; padding:8px 10px; border-bottom:1px solid var(--border);}
  td{padding:11px 10px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}

  /* ---------- concurso card ---------- */
  .concurso-card{border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:12px; background:var(--page);}
  .concurso-top{display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}
  .concurso-org{font-weight:700; font-size:14.5px;}
  .concurso-meta{font-size:12px; color:var(--text-muted); margin-top:2px;}
  .concurso-tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .concurso-fields{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px; font-size:12px;}
  .cf-label{color:var(--text-muted); font-size:10.5px; text-transform:uppercase; letter-spacing:.03em;}
  .cf-value{font-weight:700; font-size:13px; margin-top:1px;}
  .concurso-actions{display:flex; gap:8px; margin-top:12px;}

  /* ---------- modal ---------- */
  .modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .modal{background:var(--surface-1); border-radius:16px; padding:26px; max-width:520px; width:100%; max-height:88vh; overflow:auto; border:1px solid var(--border);}
  .modal h3{margin-top:0;}

  /* ---------- quiz ---------- */
  .question-card{border:1px solid var(--border); border-radius:12px; padding:18px; margin-bottom:14px; background:var(--page);}
  .question-materia{font-size:11px; font-weight:700; color:var(--series-1); text-transform:uppercase; letter-spacing:.03em; margin-bottom:6px;}
  .question-text{font-size:14.5px; font-weight:600; margin-bottom:12px;}
  .option{display:flex; gap:10px; align-items:flex-start; padding:9px 11px; border-radius:8px; border:1px solid var(--border); margin-bottom:7px; cursor:pointer; font-size:13.5px;}
  .option:hover{background:var(--surface-1);}
  .option.selected{border-color:var(--series-1); background:color-mix(in srgb, var(--series-1) 10%, transparent);}
  .option.correct{border-color:var(--good); background:color-mix(in srgb, var(--good) 12%, transparent);}
  .option.incorrect{border-color:var(--critical); background:color-mix(in srgb, var(--critical) 12%, transparent);}
  .explain{font-size:12.5px; color:var(--text-secondary); background:var(--surface-1); border-radius:8px; padding:10px 12px; margin-top:8px; border:1px solid var(--border);}

  .progress-outer{background:var(--grid); border-radius:99px; height:8px; overflow:hidden;}
  .progress-inner{background:var(--series-1); height:100%; border-radius:99px;}

  .empty-state{text-align:center; padding:40px 20px; color:var(--text-muted);}
  .muted{color:var(--text-muted);}
  .small{font-size:12px;}
  .divider{height:1px; background:var(--border); margin:16px 0;}

  .video-card{border:1px solid var(--border); border-radius:12px; padding:14px; background:var(--page);}
  .video-card h4{margin:0 0 4px 0; font-size:14px;}
  .video-card .muted{font-size:12px;}

  .specialist-card{display:flex; gap:12px; border:1px solid var(--border); border-radius:12px; padding:14px; background:var(--page); margin-bottom:10px;}
  .specialist-avatar{width:44px;height:44px;border-radius:50%;background:var(--series-3);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700; flex:0 0 44px;}

  .toast{position:fixed; bottom:22px; right:22px; background:var(--text-primary); color:var(--surface-1); padding:12px 18px; border-radius:10px; font-size:13px; font-weight:600; z-index:80; box-shadow:0 6px 20px rgba(0,0,0,.25);}
  ::placeholder{color:var(--text-muted);}

  /* ---------- auth screen ---------- */
  .auth-wrap{min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--page); position:relative;}
  .auth-wrap .theme-toggle{position:absolute; top:20px; right:20px; margin-left:0;}
  .auth-card{background:var(--surface-1); border:1px solid var(--border); border-radius:18px; padding:34px 32px; max-width:400px; width:100%; box-shadow:0 12px 40px rgba(11,11,11,0.08);}
  .auth-title{font-size:19px; font-weight:700; text-align:center; margin:0 0 4px 0;}
  .auth-sub{font-size:12.5px; color:var(--text-secondary); text-align:center; margin:0 0 18px 0;}

  /* ---------- onboarding spotlight ---------- */
  .tour-highlight{box-shadow:0 0 0 3px var(--series-1); position:relative; z-index:2;}

  /* ---------- carregamento (auth/dados) ---------- */
  .auth-spinner{width:30px; height:30px; border-radius:99px; border:3px solid var(--border); border-top-color:var(--series-1); animation:auth-spin 0.8s linear infinite; margin:0 auto 14px auto;}
  @keyframes auth-spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   APROVA+ — protótipo interativo (dados de exemplo em memória)
   Todos os dados de concursos, bancas e vídeos foram pesquisados
   em fontes públicas em 14–15/08/2026. Sujeitos a mudança — o
   usuário deve sempre confirmar no edital oficial.
   ============================================================ */

const HOJE = new Date('2026-08-15T09:00:00');

/* ---------------- BACKEND REAL (Supabase) ---------------- */
const SUPABASE_URL = 'https://giklfyvsqhcvslhktpts.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdpa2xmeXZzcWhjdnNsaGt0cHRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3NjU5NzcsImV4cCI6MjEwMjM0MTk3N30.QmEVfMXIR9EHTQWUzL8Nb8y6KOJcQLDh5fJtFp3jyD8';
let sb = null; // instanciado depois que o SDK do Supabase terminar de carregar (ver bootstrap no fim do arquivo)
const CONTA_AMOSTRA_EMAIL = 'amostra@aprovamais.com.br';
const CONTA_AMOSTRA_SENHA = 'Amostra@2026';

/* Carrega o SDK do Supabase dinamicamente, tentando mais de um CDN — se o
   primeiro estiver bloqueado (firewall, bloqueador de conteúdo, rede
   corporativa etc.) tenta o próximo, em vez de travar o app. */
function carregarScript(src){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('Falha ao carregar ' + src));
    document.head.appendChild(s);
  });
}
async function carregarSupabaseSDK(){
  if(window.supabase && window.supabase.createClient) return true;
  const cdns = [
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js',
    'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js',
  ];
  for(const url of cdns){
    try{
      await carregarScript(url);
      if(window.supabase && window.supabase.createClient) return true;
    }catch(err){ console.error(err); }
  }
  return false;
}
function renderErroConexaoScreen(){
  return `
  <div class="auth-wrap">
    <div class="auth-card" style="text-align:center;">
      <div class="brand" style="padding:0 0 18px 0; justify-content:center;">
        <img class="brand-mark-img" src="${BRAND_ICON}" alt="Aprova+"><img class="brand-name-img" src="${BRAND_WORDMARK}" style="height:20px;" alt="Aprova+">
      </div>
      <p class="auth-title">Não foi possível conectar</p>
      <p class="auth-sub">Não conseguimos carregar os recursos necessários para acessar sua conta. Verifique sua conexão com a internet — se estiver em uma rede corporativa ou usando bloqueador de conteúdo, ele pode estar impedindo o carregamento de scripts externos.</p>
      <button class="btn btn-primary" style="width:100%; justify-content:center;" onclick="location.reload()">🔄 Tentar novamente</button>
    </div>
  </div>`;
}

function traduzErroAuth(error){
  const msg = (error && error.message) || '';
  if(/Invalid login credentials/i.test(msg)) return 'E-mail ou senha incorretos.';
  if(/User already registered/i.test(msg)) return 'Já existe uma conta com este e-mail. Tente entrar.';
  if(/Password should be at least/i.test(msg)) return 'A senha precisa ter pelo menos 6 caracteres.';
  if(/Unable to validate email address|invalid.*email/i.test(msg)) return 'Informe um e-mail válido.';
  if(/rate limit/i.test(msg)) return 'Muitas tentativas em pouco tempo. Aguarde um instante e tente novamente.';
  if(/network|fetch/i.test(msg)) return 'Não foi possível conectar ao servidor. Verifique sua internet e tente novamente.';
  return 'Não foi possível completar a operação. Tente novamente.';

const App = {
  state: {
    view: 'home',
    concursosTab: 'sugeridos',
    filtroEstado: 'Todos',
    filtroNivel: 'Todos',
    modal: null,
    pendingInscricao: null,
    buscaConcurso: '',
    buscaResultadoMsg: null,
    prova: null,
    provaResultado: null,
    especialistaSolicitado: null,
    toast: null,
    auth: { loggedIn:false, modo:'entrar', erro:null, carregando:true, aguardandoConfirmacao:false },
    accountType: null, // 'amostra' | 'padrao'
    onboarding: { ativo:false, passo:0 },
    theme: null, // null = segue o sistema; 'light' | 'dark' = escolha explícita do usuário
  },

  _userId: null,

  async init(){
    applyTheme();
    this.render();
    try{
      const { data:{ session } } = await sb.auth.getSession();
      if(session && session.user){
        await this.loadUserData(session.user);
        return;
      }
    }catch(err){ console.error(err); }
    this.state.auth.carregando = false;
    this.render();
  },

  /* ---------- autenticação real (Supabase Auth) ---------- */
  async loadUserData(user){
    this._userId = user.id;
    try{
      const [{data:profile, error:pErr}, {data:concursos}, {data:simulados}, {data:desemp}] = await Promise.all([
        sb.from('profiles').select('*').eq('id', user.id).maybeSingle(),
        sb.from('user_concursos').select('concurso_id').eq('user_id', user.id),
        sb.from('simulados').select('*').eq('user_id', user.id).order('created_at', {ascending:true}),
        sb.from('desempenho_materia').select('materia, percentual').eq('user_id', user.id),
      ]);
      if(pErr) throw pErr;
      const desempenhoPorMateria = {};
      (desemp||[]).forEach(d => { desempenhoPorMateria[d.materia] = d.percentual; });
      const historicoSimulados = (simulados||[]).map(s => ({
        data: new Date(s.created_at).toLocaleDateString('pt-BR'),
        concursoId: s.concurso_id,
        tipo: s.modo === 'breve' ? 'Breve' : 'Completo',
        nota: s.nota_geral,
      }));
      Object.assign(this.state, {
        perfil: {
          nome: profile?.nome || '',
          email: profile?.email || user.email || '',
          nivelInteresse: profile?.nivel_interesse || [],
          estadosInteresse: profile?.estados_interesse || [],
          cargoPretendido: profile?.cargo_pretendido || '',
        },
        meusConcursos: (concursos||[]).map(c => c.concurso_id),
        historicoSimulados,
        desempenhoPorMateria,
      });
      this.state.accountType = profile?.account_type || 'padrao';
      this.state.auth = {loggedIn:true, modo:'entrar', erro:null, carregando:false, aguardandoConfirmacao:false};
      this.state.view = 'home';
      this.state.onboarding = {ativo: !(profile?.onboarding_concluido), passo:0};
    }catch(err){
      console.error(err);
      this._userId = null;
      this.state.auth = {loggedIn:false, modo:'entrar', erro:'Não foi possível carregar seus dados agora. Tente novamente.', carregando:false, aguardandoConfirmacao:false};
    }
    this.render();
  },
  async startSample(){
    this.state.auth.carregando = true;
    this.state.auth.erro = null;
    this.render();
    const { data, error } = await sb.auth.signInWithPassword({ email: CONTA_AMOSTRA_EMAIL, password: CONTA_AMOSTRA_SENHA });
    if(error){
      this.state.auth = {loggedIn:false, modo:'entrar', erro:'Não foi possível abrir a conta de amostra agora. Tente novamente em instantes.', carregando:false, aguardandoConfirmacao:false};
      this.render();
      return;
    }
    await this.loadUserData(data.user);
  },
  async submitAuth(modo){
    const email = (document.getElementById('auth-email')||{}).value?.trim() || '';
    const senha = (document.getElementById('auth-senha')||{}).value?.trim() || '';
    const nome = (document.getElementById('auth-nome')||{}).value?.trim() || '';
    if(!email || !senha){
      this.state.auth.erro = 'Preencha e-mail e senha para continuar.';
      this.render();
      return;
    }
    if(modo === 'criar' && senha.length < 6){
      this.state.auth.erro = 'A senha precisa ter pelo menos 6 caracteres.';
      this.render();
      return;
    }
    this.state.auth.carregando = true;
    this.state.auth.erro = null;
    this.render();

    if(modo === 'criar'){
      const { data, error } = await sb.auth.signUp({ email, password: senha, options: { data: { nome } } });
      if(error){
        this.state.auth = {loggedIn:false, modo, erro: traduzErroAuth(error), carregando:false, aguardandoConfirmacao:false};
        this.render();
        return;
      }
      if(data.session){
        await this.loadUserData(data.user);
      } else {
        // projeto exige confirmação de e-mail antes do primeiro login
        this.state.auth = {loggedIn:false, modo:'entrar', erro:null, carregando:false, aguardandoConfirmacao:true};
        this.render();
      }
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
      if(error){
        this.state.auth = {loggedIn:false, modo, erro: traduzErroAuth(error), carregando:false, aguardandoConfirmacao:false};
        this.render();
        return;
      }
      await this.loadUserData(data.user);
    }
  },
  setAuthModo(modo){ this.state.auth.modo = modo; this.state.auth.erro = null; this.state.auth.aguardandoConfirmacao = false; this.render(); },
  async logout(){
    this.state.auth.carregando = true;
    this.render();
    try{ await sb.auth.signOut(); }catch(err){ console.error(err); }
    this._userId = null;
    Object.assign(this.state, makeBlankData('',''));
    this.state.auth = {loggedIn:false, modo:'entrar', erro:null, carregando:false, aguardandoConfirmacao:false};
    this.state.accountType = null;
    this.state.view = 'home';
    this.state.modal = null;
    this.render();
  },

  /* ---------- modo claro/escuro ---------- */
  toggleTheme(){
    this.state.theme = isDarkEffective() ? 'light' : 'dark';
    applyTheme();
    this.render();
  },

  /* ---------- jornada de boas-vindas ---------- */
  tourNext(){
    const t = this.state.onboarding;
    if(t.passo < TOUR_STEPS.length-1){ t.passo += 1; } else { t.ativo = false; }
    this.render();
  },
  tourPrev(){ const t=this.state.onboarding; if(t.passo>0) t.passo -= 1; this.render(); },
  tourSkip(){ this.state.onboarding.ativo = false; this.render(); },
  tourRestart(){ this.state.onboarding = {ativo:true, passo:0}; this.render(); },

  set(patch){ Object.assign(this.state, patch); this.render(); },

  showToast(msg){
    this.state.toast = msg;
    this.render();
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(()=>{ this.state.toast = null; this.render(); }, 3200);
  },

  navigate(view){ this.set({view, modal:null}); window.scrollTo(0,0); },

  /* ---------- concursos helpers ---------- */
  getConcurso(id){ return CONCURSOS.find(c => c.id === id); },
  isMeuConcurso(id){ return this.state.meusConcursos.includes(id); },

  addConcurso(id){
    if(!this.state.meusConcursos.includes(id)){
      this.state.meusConcursos.push(id);
      this.showToast('Concurso adicionado à sua lista.');
      this.persistConcurso(id, 'interesse');
    } else { this.render(); }
  },
  removeConcurso(id){
    this.state.meusConcursos = this.state.meusConcursos.filter(x => x !== id);
    this.showToast('Concurso removido da sua lista.');
    this.persistRemoverConcurso(id);
  },
  async persistConcurso(id, status){
    if(!this._userId) return;
    const { error } = await sb.from('user_concursos')
      .upsert({ user_id: this._userId, concurso_id: id, status }, { onConflict: 'user_id,concurso_id' });
    if(error) console.error(error);
  },
  async persistRemoverConcurso(id){
    if(!this._userId) return;
    const { error } = await sb.from('user_concursos').delete().eq('user_id', this._userId).eq('concurso_id', id);
    if(error) console.error(error);
  },

  toggleChip(field, value){
    const arr = this.state.perfil[field];
    const i = arr.indexOf(value);
    if(i>-1) arr.splice(i,1); else arr.push(value);
    this.render();
  },

  salvarPerfil(){
    const nome = document.getElementById('perfil-nome').value.trim();
    const email = document.getElementById('perfil-email').value.trim();
    const cargo = document.getElementById('perfil-cargo').value.trim();
    if(nome) this.state.perfil.nome = nome;
    if(email) this.state.perfil.email = email;
    if(cargo) this.state.perfil.cargoPretendido = cargo;
    this.set({modal:null});
    this.showToast('Perfil atualizado.');
    this.persistPerfil();
  },
  async persistPerfil(){
    if(!this._userId) return;
    const p = this.state.perfil;
    const { error } = await sb.from('profiles').update({
      nome: p.nome,
      email: p.email,
      cargo_pretendido: p.cargoPretendido,
      nivel_interesse: p.nivelInteresse,
      estados_interesse: p.estadosInteresse,
      onboarding_concluido: true,
    }).eq('id', this._userId);
    if(error) console.error(error);
  },

  /* ---------- busca / validação de concurso ---------- */
  buscarConcurso(){
    const termo = document.getElementById('busca-input').value.trim();
    this.state.buscaConcurso = termo;
    if(!termo){ this.state.buscaResultadoMsg = null; this.render(); return; }
    const norm = termo.toLowerCase();
    const achou = CONCURSOS.filter(c => c.orgao.toLowerCase().includes(norm) || c.id.includes(norm));
    if(achou.length === 0){
      this.state.buscaResultadoMsg = {tipo:'nao-encontrado', termo};
    } else {
      this.state.buscaResultadoMsg = {tipo:'encontrado', ids: achou.map(c=>c.id)};
    }
    this.render();
  },

  irParaInscricao(id){
    const c = this.getConcurso(id);
    window.open(c.fonteUrl, '_blank');
    this.state.pendingInscricao = id;
    this.render();
  },
  confirmarInscricao(id, inscreveu){
    this.state.pendingInscricao = null;
    if(inscreveu){
      if(!this.state.meusConcursos.includes(id)){
        this.state.meusConcursos.push(id);
      }
      this.showToast('Que bom! Concurso adicionado à sua lista de acompanhamento.');
      this.persistConcurso(id, 'inscrito');
    } else {
      this.render();
    }
  },

  /* ---------- simulado ---------- */
  abrirSimulado(concursoId){
    this.set({modal:{tipo:'iniciar-simulado', concursoId}});
  },
  iniciarProva(concursoId, modoTeste){
    const c = this.getConcurso(concursoId);
    const preferirCE = (c.banca === 'Cebraspe' || c.banca === 'Quadrix');
    // 1) banco histórico real da banca do concurso (sorteado a cada tentativa)
    const historicoBanca = shuffle(QUESTOES_HISTORICO.filter(q => q.banca === c.banca));
    // 2) banco padrão (autoral, verídico) como complemento — prioriza o formato da banca
    let bancoPadrao = QUESTOES.filter(q => preferirCE ? q.tipo==='CE' : true);
    if(bancoPadrao.length < 14) bancoPadrao = QUESTOES.slice();
    bancoPadrao = shuffle(bancoPadrao);

    // amostra proporcional por matéria: real primeiro, padrão completa o restante
    let selecionadas = [];
    MATERIAS.forEach(m => {
      const alvo = modoTeste === 'breve' ? 2 : 4;
      const reaisDaMateria = historicoBanca.filter(q=>q.materia===m).slice(0, alvo);
      const faltam = alvo - reaisDaMateria.length;
      const padraoDaMateria = bancoPadrao.filter(q=>q.materia===m).slice(0, Math.max(0, faltam));
      selecionadas = selecionadas.concat(reaisDaMateria, padraoDaMateria);
    });
    if(selecionadas.length === 0) selecionadas = shuffle(QUESTOES).slice(0, modoTeste==='breve'?14:28);
    selecionadas = shuffle(selecionadas);
    const qtdReais = selecionadas.filter(q=>q.real).length;
    this.set({
      modal:null,
      prova: {
        concursoId, modoTeste, perguntas: selecionadas,
        respostas: {}, atual: 0, revelada: false, qtdReais,
      },
      provaResultado: null,
      view:'prova-em-andamento',
    });
  },
  responder(valor){
    const p = this.state.prova;
    p.respostas[p.atual] = valor;
    p.revelada = true;
    this.render();
  },
  proximaPergunta(){
    const p = this.state.prova;
    if(p.atual < p.perguntas.length - 1){
      p.atual += 1; p.revelada = (p.respostas[p.atual] !== undefined);
      this.render();
    } else {
      this.finalizarProva();
    }
  },
  perguntaAnterior(){
    const p = this.state.prova;
    if(p.atual>0){ p.atual -= 1; p.revelada = (p.respostas[p.atual] !== undefined); this.render(); }
  },
  finalizarProva(){
    const p = this.state.prova;
    const porMateria = {};
    p.perguntas.forEach((q, idx) => {
      porMateria[q.materia] = porMateria[q.materia] || {acertos:0, total:0};
      porMateria[q.materia].total += 1;
      const resp = p.respostas[idx];
      const correta = q.tipo==='CE' ? (resp === q.gabarito) : (resp === q.correta);
      if(correta) porMateria[q.materia].acertos += 1;
    });
    const totalAcertos = Object.values(porMateria).reduce((s,m)=>s+m.acertos,0);
    const totalQ = p.perguntas.length;
    const notaGeral = Math.round((totalAcertos/totalQ)*100);
    const resultado = {concursoId: p.concursoId, modoTeste: p.modoTeste, porMateria, notaGeral, totalQ, totalAcertos};

    // atualiza dashboards globais (média simples com histórico existente)
    Object.entries(porMateria).forEach(([m, v])=>{
      const pct = Math.round((v.acertos/v.total)*100);
      const atual = this.state.desempenhoPorMateria[m];
      this.state.desempenhoPorMateria[m] = atual === undefined ? pct : Math.round((atual + pct)/2);
    });
    this.state.historicoSimulados.push({
      data: HOJE.toLocaleDateString('pt-BR'), concursoId: p.concursoId,
      tipo: p.modoTeste === 'breve' ? 'Breve' : 'Completo', nota: notaGeral
    });

    this.set({provaResultado: resultado, prova:null, view:'resultado-simulado'});
    this.persistResultado(resultado);
  },
  async persistResultado(resultado){
    if(!this._userId) return;
    try{
      const { error: e1 } = await sb.from('simulados').insert({
        user_id: this._userId,
        concurso_id: resultado.concursoId,
        modo: resultado.modoTeste,
        nota_geral: resultado.notaGeral,
        total_questoes: resultado.totalQ,
        total_acertos: resultado.totalAcertos,
        por_materia: resultado.porMateria,
      });
      if(e1) console.error(e1);
      const upserts = Object.keys(this.state.desempenhoPorMateria).map(m => ({
        user_id: this._userId, materia: m, percentual: this.state.desempenhoPorMateria[m],
      }));
      if(upserts.length){
        const { error: e2 } = await sb.from('desempenho_materia').upsert(upserts, { onConflict: 'user_id,materia' });
        if(e2) console.error(e2);
      }
    }catch(err){ console.error(err); }
  },

  solicitarEspecialista(concursoId){
    const esp = ESPECIALISTAS[Math.floor(Math.random()*ESPECIALISTAS.length)];
    this.set({especialistaSolicitado: {especialista: esp, concursoId, horario: proximoHorarioUtil()}, view:'especialista'});
  },
};

function isDarkEffective(){
  if(App.state.theme === 'dark') return true;
  if(App.state.theme === 'light') return false;
  return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
}
function applyTheme(){
  if(App.state.theme){ document.documentElement.setAttribute('data-theme', App.state.theme); }
  else { document.documentElement.removeAttribute('data-theme'); }
}
function themeToggleBtn(extraStyle){
  const dark = isDarkEffective();
  return `<button class="theme-toggle" style="${extraStyle||''}" onclick="App.toggleTheme()" title="${dark ? 'Ativar modo claro' : 'Ativar modo escuro'}" aria-label="Alternar modo claro/escuro">${dark ? '☀️' : '🌙'}</button>`;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function proximoHorarioUtil(){
  const d = new Date(HOJE); d.setDate(d.getDate()+2);
  const dias = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
  return dias[d.getDay()] + ', ' + d.toLocaleDateString('pt-BR') + ' às 19h';
}

/* ============================================================
   COMPONENTES DE GRÁFICO (SVG puro)
   ============================================================ */
function svgHBarChart(data, opts={}){
  // data: [{label, value, colorVar}]
  const max = Math.max(...data.map(d=>d.value), 1);
  return data.map(d => {
    const pct = Math.max(2, (d.value/max)*100);
    const color = d.colorVar || 'var(--series-1)';
    return `<div class="hbar-row">
      <div class="hbar-label" title="${esc(d.label)}">${esc(d.label)}</div>
      <div class="hbar-track"><div class="hbar-fill" style="width:${pct}%; background:${color};"></div></div>
      <div class="hbar-value">${d.value}${opts.suffix||''}</div>
    </div>`;
  }).join('');
}

function statusColor(pct){
  if(pct >= 70) return {color:'var(--good)', label:'Ponto forte', badge:'badge-good', icon:'▲'};
  if(pct >= 45) return {color:'var(--warning)', label:'Mediano', badge:'badge-warning', icon:'●'};
  return {color:'var(--critical)', label:'Ponto fraco', badge:'badge-critical', icon:'▼'};
}

function desempenhoChart(desempenho){
  const entries = Object.entries(desempenho).sort((a,b)=>a[1]-b[1]);
  return entries.map(([materia, pct])=>{
    const s = statusColor(pct);
    return `<div class="hbar-row" style="grid-template-columns:170px 1fr 96px;">
      <div class="hbar-label" title="${esc(materia)}">${esc(materia)}</div>
      <div class="hbar-track"><div class="hbar-fill" style="width:${pct}%; background:${s.color};"></div></div>
      <div><span class="badge ${s.badge}">${s.icon} ${pct}%</span></div>
    </div>`;
  }).join('');
}

function lineChartSVG(points, opts={}){
  const w = 100, h = 40, pad = 4;
  const vals = points.map(p=>p.nota);
  const min = Math.min(...vals, 0), max = Math.max(...vals, 100);
  const xs = points.map((p,i)=> pad + (i*(w-2*pad)/Math.max(1,points.length-1)));
  const ys = points.map(p=> h-pad - ((p.nota-min)/(max-min||1))*(h-2*pad));
  const path = xs.map((x,i)=> (i===0?'M':'L') + x.toFixed(1) + ',' + ys[i].toFixed(1)).join(' ');
  const dots = xs.map((x,i)=> `<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="1.6" fill="var(--series-1)"/>`).join('');
  const labels = points.map((p,i)=> `<text x="${xs[i].toFixed(1)}" y="${(ys[i]-3).toFixed(1)}" font-size="3.6" text-anchor="middle" fill="var(--text-secondary)">${p.nota}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:120px;">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--baseline)" stroke-width="0.4"/>
    <path d="${path}" fill="none" stroke="var(--series-1)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}${labels}
  </svg>`;
}

/* ---------------- PROVA EM ANDAMENTO ---------------- */
function renderProvaEmAndamento(){
  const p = App.state.prova;
  if(!p) return `<div class="empty-state">Nenhuma prova em andamento.</div>`;
  const c = App.getConcurso(p.concursoId);
  const q = p.perguntas[p.atual];
  const resp = p.respostas[p.atual];
  const pct = Math.round(((p.atual)/p.perguntas.length)*100);

  let opcoesHtml = '';
  if(q.tipo === 'CE'){
    opcoesHtml = ['Certo','Errado'].map((label,i)=>{
      const val = i===0;
      let cls = 'option';
      if(p.revelada){
        if(val === q.gabarito) cls += ' correct';
        else if(resp===val) cls += ' incorrect';
      } else if(resp===val) cls += ' selected';
      return `<div class="${cls}" onclick="${p.revelada?'':`App.responder(${val})`}">${label}</div>`;
    }).join('');
  } else {
    opcoesHtml = q.alternativas.map((alt,i)=>{
      let cls = 'option';
      if(p.revelada){
        if(i === q.correta) cls += ' correct';
        else if(resp===i) cls += ' incorrect';
      } else if(resp===i) cls += ' selected';
      return `<div class="${cls}" onclick="${p.revelada?'':`App.responder(${i})`}">${String.fromCharCode(65+i)}) ${esc(alt)}</div>`;
    }).join('');
  }

  return `
  <div class="page-header">
    <div><p class="page-title">Simulado — ${esc(c.orgao)}</p><p class="page-subtitle">Questão ${p.atual+1} de ${p.perguntas.length} · Modo ${p.modoTeste==='breve'?'Breve':'Completo'}${p.qtdReais?` · 📜 ${p.qtdReais} questões reais de provas anteriores`:''}</p></div>
    <button class="btn" onclick="if(confirm('Encerrar o simulado agora? Você pode finalizar a qualquer momento.')) App.finalizarProva()">Encerrar e ver resultado</button>
  </div>
  <div class="progress-outer" style="margin-bottom:20px;"><div class="progress-inner" style="width:${pct}%;"></div></div>
  <div class="question-card">
    <div class="question-materia">${esc(q.materia)} ${q.tipo==='CE'?'· Certo/Errado':'· Múltipla escolha'} ${q.real?`· <span class="badge badge-good" style="text-transform:none;">📜 Questão real — ${esc(q.concursoOrigem)}</span>`:''}</div>
    <div class="question-text">${esc(q.enunciado)}</div>
    ${opcoesHtml}
    ${p.revelada ? `<div class="explain"><strong>Explicação:</strong> ${esc(q.explicacao)} ${q.real?`<br><span class="muted small">Fonte: <a href="${q.fonteUrl}" target="_blank" rel="noopener">${esc(q.fonte)}</a></span>`:''}</div>` : ''}
  </div>
  <div style="display:flex; justify-content:space-between;">
    <button class="btn" ${p.atual===0?'disabled':''} onclick="App.perguntaAnterior()">← Anterior</button>
    <button class="btn btn-primary" ${!p.revelada?'disabled':''} onclick="App.proximaPergunta()">${p.atual===p.perguntas.length-1 ? 'Finalizar simulado' : 'Próxima →'}</button>
  </div>
  `;
}

/* ---------------- RESULTADO DO SIMULADO ---------------- */
function renderResultadoSimulado(){
  const r = App.state.provaResultado;
  if(!r) return `<div class="empty-state">Nenhum resultado disponível. <button class="btn" onclick="App.navigate('simulados')">Voltar aos simulados</button></div>`;
  const c = App.getConcurso(r.concursoId);
  const s = statusColor(r.notaGeral);
  const entradas = Object.entries(r.porMateria).map(([m,v])=>({materia:m, pct: Math.round((v.acertos/v.total)*100), acertos:v.acertos, total:v.total}));
  const fortes = entradas.filter(e=>e.pct>=70).sort((a,b)=>b.pct-a.pct);
  const medianas = entradas.filter(e=>e.pct>=45 && e.pct<70);
  const fracas = entradas.filter(e=>e.pct<45).sort((a,b)=>a.pct-b.pct);
  const bancaInfo = BANCAS[c.banca] || {};

  return `
  <div class="page-header">
    <div><p class="page-title">Resultado — ${esc(c.orgao)}</p><p class="page-subtitle">Modo ${r.modoTeste==='breve'?'Breve':'Completo'} · ${r.totalQ} questões</p></div>
    <button class="btn btn-primary" onclick="App.navigate('simulados')">Fazer outro simulado</button>
  </div>

  <div class="grid grid-4" style="margin-bottom:16px;">
    <div class="card stat-tile"><div class="stat-label">Nota geral</div><div class="stat-value">${r.notaGeral}%</div><div class="stat-delta"><span class="badge ${s.badge}">${s.label}</span></div></div>
    <div class="card stat-tile"><div class="stat-label">Acertos</div><div class="stat-value">${r.totalAcertos}/${r.totalQ}</div></div>
    <div class="card stat-tile"><div class="stat-label">Pontos fortes</div><div class="stat-value">${fortes.length}</div><div class="stat-delta">matérias ≥70%</div></div>
    <div class="card stat-tile"><div class="stat-label">Pontos a melhorar</div><div class="stat-value">${fracas.length}</div><div class="stat-delta">matérias &lt;45%</div></div>
  </div>

  <div class="grid grid-2">
    <div class="card">
      <p class="card-title">Desempenho por matéria nesta prova</p>
      ${desempenhoChart(Object.fromEntries(entradas.map(e=>[e.materia,e.pct])))}
    </div>
    <div class="card">
      <p class="card-title">Material de estudo personalizado</p>
      <p class="card-sub">Gerado a partir do seu resultado e do estilo da banca ${esc(c.banca)}</p>
      <div class="small" style="margin-bottom:10px; color:var(--text-secondary);"><strong>Sobre a banca:</strong> ${esc(bancaInfo.perfil||'')}</div>
      ${fracas.length ? `<div style="margin-bottom:10px;"><strong class="small">🔴 Prioridade máxima:</strong>${fracas.map(f=>`<div class="small" style="margin:4px 0 4px 10px;">• <strong>${esc(f.materia)}</strong> (${f.pct}%) — ${estudoSugestao(f.materia, c.banca)}</div>`).join('')}</div>` : ''}
      ${medianas.length ? `<div style="margin-bottom:10px;"><strong class="small">🟡 Reforçar:</strong>${medianas.map(f=>`<div class="small" style="margin:4px 0 4px 10px;">• <strong>${esc(f.materia)}</strong> (${f.pct}%) — ${estudoSugestao(f.materia, c.banca)}</div>`).join('')}</div>` : ''}
      ${fortes.length ? `<div><strong class="small">🟢 Manter em revisão espaçada:</strong>${fortes.map(f=>`<div class="small" style="margin:4px 0 4px 10px;">• <strong>${esc(f.materia)}</strong> (${f.pct}%) — bom domínio, revise semanalmente para não enferrujar.</div>`).join('')}</div>` : ''}
      <div class="divider"></div>
      <button class="btn btn-primary" style="width:100%;" onclick="App.solicitarEspecialista('${r.concursoId}')">🎓 Conversar com um especialista sobre este resultado</button>
    </div>
  </div>
  `;
}

function estudoSugestao(materia, banca){
  const dicas = {
    'Língua Portuguesa': 'revise regência, crase e concordância com exercícios de fixação; leia textos jornalísticos diariamente.',
    'Raciocínio Lógico-Matemático': 'pratique tabelas-verdade, proposições compostas e problemas de porcentagem/conjuntos diariamente.',
    'Direito Constitucional': 'releia os artigos 5º a 17 e o processo legislativo (art. 59 a 69); grife palavras-chave dos incisos.',
    'Direito Administrativo': 'foque nos princípios (LIMPE), poderes administrativos e Lei nº 14.133/2021.',
    'Informática': 'pratique fórmulas de planilhas e revise conceitos de redes e segurança da informação.',
    'Atualidades': 'acompanhe semanalmente um resumo de notícias e revise reforma tributária, LGPD e Marco Civil.',
    'Ética e Direitos Humanos': 'releia o Decreto nº 1.171/1994 e a Lei nº 8.429/1992 (improbidade administrativa).',
  };
  const extra = (banca==='Cebraspe'||banca==='Quadrix') ? ' Como a banca usa Certo/Errado, treine identificar a palavra que torna a afirmativa falsa.' : ' Como a banca usa múltipla escolha, treine eliminar alternativas incorretas por partes.';
  return (dicas[materia]||'revise o conteúdo teórico e faça questões comentadas.') + extra;
}

      </div>

      ${modo==='criar' ? `<div class="field"><label>Nome completo</label><input id="auth-nome" type="text" placeholder="Como podemos te chamar?" onkeydown="if(event.key==='Enter') App.submitAuth('${modo}')"></div>` : ''}
      <div class="field"><label>E-mail</label><input id="auth-email" type="email" placeholder="voce@email.com" onkeydown="if(event.key==='Enter') App.submitAuth('${modo}')"></div>
      <div class="field"><label>Senha</label><input id="auth-senha" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter') App.submitAuth('${modo}')"></div>
      ${a.erro ? `<p class="small" style="color:var(--critical); margin:-6px 0 12px 0;">${esc(a.erro)}</p>` : ''}

      <button class="btn btn-primary" style="width:100%; justify-content:center;" onclick="App.submitAuth('${modo}')">${modo==='criar' ? 'Criar conta e começar' : 'Entrar'}</button>

      <p class="small muted" style="margin-top:14px; text-align:center;">Seus dados ficam salvos com segurança em um banco de dados real (Supabase) e continuam disponíveis da próxima vez que você entrar, em qualquer navegador.</p>

      <div class="divider"></div>
      <p class="small" style="text-align:center; margin-bottom:8px;">Só quer explorar antes?</p>
      <button class="btn btn-ghost" style="width:100%; justify-content:center;" onclick="App.startSample()">👀 Ver conta de amostra (com dados de exemplo)</button>
    </div>
  </div>`;
}

/* ---------------- JORNADA DE BOAS-VINDAS ---------------- */
function renderOnboardingModal(){
  const t = App.state.onboarding;
  const step = TOUR_STEPS[t.passo];
  const ultimo = t.passo === TOUR_STEPS.length-1;
  return `<div class="modal-backdrop">
    <div class="modal" style="max-width:440px; text-align:center;">
      <div style="display:flex; justify-content:flex-end;"><button class="btn btn-ghost btn-sm" onclick="App.tourSkip()">Pular ✕</button></div>
      <div style="font-size:40px; margin-bottom:6px;">${step.emoji}</div>
      <h3 style="margin-bottom:8px;">${esc(step.titulo)}</h3>
      <p class="small" style="color:var(--text-secondary); margin-bottom:18px;">${esc(step.desc)}</p>
      <div style="display:flex; justify-content:center; gap:6px; margin-bottom:18px;">
        ${TOUR_STEPS.map((s,i)=>`<div style="width:7px; height:7px; border-radius:99px; background:${i===t.passo?'var(--series-1)':'var(--grid)'};"></div>`).join('')}
      </div>
      <div style="display:flex; gap:10px;">
        ${t.passo>0 ? `<button class="btn" style="flex:1;" onclick="App.tourPrev()">← Voltar</button>` : ''}
        <button class="btn btn-primary" style="flex:1;" onclick="App.tourNext()">${ultimo ? 'Começar a usar' : 'Próximo →'}</button>
      </div>
    </div>
  </div>`;
}

/* ============================================================
   RENDER PRINCIPAL
   ============================================================ */
function App_render(){
  const st = App.state;

  if(!st.auth.loggedIn){
    document.getElementById('app').innerHTML = renderAuthScreen();
    return;
  }

  let content = '';
  if(st.view==='home') content = renderHome();
  else if(st.view==='concursos') content = renderConcursos();
  else if(st.view==='simulados') content = renderSimulados();
  else if(st.view==='prova-em-andamento') content = renderProvaEmAndamento();
  else if(st.view==='resultado-simulado') content = renderResultadoSimulado();
  else if(st.view==='especialista') content = renderEspecialista();
  else if(st.view==='videos') content = renderVideos();
  else if(st.view==='perfil'){ st.view='home'; st.modal='perfil'; content = renderHome(); }

  document.getElementById('app').innerHTML = `
    ${renderSidebar()}
    <div class="main">${content}</div>
    ${st.modal==='perfil' ? renderPerfilModal() : ''}
    ${st.onboarding.ativo ? renderOnboardingModal() : ''}
    ${st.toast ? `<div class="toast">${esc(st.toast)}</div>` : ''}
  `;
}
App.render = App_render;
App.render(); // mostra a tela de carregamento imediatamente, enquanto o SDK é buscado
(async function bootstrap(){
  const ok = await carregarSupabaseSDK();
  if(!ok){
    document.getElementById('app').innerHTML = renderErroConexaoScreen();
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  App.init();
})();
</script>
</body>
</html>
